apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: muffin-currency
  namespace: default
spec:
  hosts:
    - muffin-currency.com
  gateways:
    - ilyatyamin-muffin-istio-gateway
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: muffin-currency
            port:
              number: 8080
      retries: # https://habr.com/ru/companies/domclick/articles/521458/
        attempts: 3
        perTryTimeout: 1s
        retryOn: 5xx
      timeout: 3s
