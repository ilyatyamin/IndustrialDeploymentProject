prometheus:
  enabled: true
  prometheusSpec:
    # Интервалы сбора метрик
    scrapeInterval: 15s
    evaluationInterval: 15s

    # Дополнительные конфигурации скрэпинга
    additionalScrapeConfigs:
      # Скрэпинг метрик из OpenTelemetry Collector
      - job_name: 'otel-collector-metrics'
        scrape_interval: 10s
        scrape_timeout: 5s
        metrics_path: '/metrics'
        static_configs:
          - targets:
              - 'opentelemetry-collector.wallet-monitoring.svc.cluster.local:8889'
            labels:
              component: 'otel-collector'
              environment: 'k8s'

      # Скрэпинг внутренних метрик OTEL Collector
      - job_name: 'otel-collector-internal'
        scrape_interval: 15s
        metrics_path: '/metrics'
        static_configs:
          - targets:
              - 'opentelemetry-collector.wallet-monitoring.svc.cluster.local:8888'
            labels:
              component: 'otel-collector-internal'

      # Прямой скрэпинг muffin-wallet (опционально, как backup)
      - job_name: 'muffin-wallet-direct'
        scrape_interval: 15s
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets:
              - 'muffin-wallet.default.svc.cluster.local:8081'
            labels:
              app: 'muffin-wallet'
              environment: 'k8s'

    # Retention для метрик
    retention: 15d
    retentionSize: "10GB"

    # Ресурсы для Prometheus
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

# Grafana интеграция
grafana:
  enabled: true
  adminPassword: admin123
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-operated:9090
          access: proxy
          isDefault: true