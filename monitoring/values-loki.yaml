mode: SingleBinary

replicaCount: 1

image:
  repository: grafana/loki
  tag: 3.6.1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3100

loki:
  auth_enabled: false
  storage:
    bucketNames:
      chunks: "dummy"
      ruler: "dummy"
      admin: "dummy"
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage_config:
    filesystem:
      directory: /var/loki/chunks
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
  ruler:
    enable_api: true
  otlp_config: {}   # для приёма логов по OTLP

# Отключаем всё лишнее
minio:
  enabled: false
gateway:
  enabled: false
canary:
  enabled: false

singleBinary:
  persistence:
    enabled: false   # без постоянного хранилища (для демо)

# Полностью отключаем все микросервисные компоненты
write:
  enabled: false
read:
  enabled: false
backend:
  enabled: false
ingester:
  enabled: false
querier:
  enabled: false
queryFrontend:
  enabled: false
queryScheduler:
  enabled: false
distributor:
  enabled: false
compactor:
  enabled: false
indexGateway:
  enabled: false
bloomCompactor:
  enabled: false
bloomGateway:
  enabled: false