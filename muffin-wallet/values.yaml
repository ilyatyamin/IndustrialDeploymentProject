replicaCount: 2

image:
  repository: aadan1lov/muffin-wallet
  tag: "1.1.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8081
  targetPort: 8081

containerPort: 8081

probes:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 10
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 10
    periodSeconds: 5

autoscaling:
  enabled: false

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: "muffin-wallet.com"
      paths:
        - path: /
          pathType: Prefix
  tls: []

env:
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://host.minikube.internal:5432/postgres"
  - name: SPRING_DATASOURCE_USERNAME
    value: "postgres"
  - name: SPRING_DATASOURCE_PASSWORD
    value: "postgres"
  - name: SERVER_PORT
    value: "8081"
  - name: SPRING_PROFILES_ACTIVE
    value: "default"
  - name: SPRING_MAIN_LOGGING_LEVEL
    value: "DEBUG"
  - name: SPRING_BOOT_LOGGING_DEBUG
    value: "true"
  - name: CURRENCY_SERVICE_URL
    value: "http://muffin-currency:8083/rate"
