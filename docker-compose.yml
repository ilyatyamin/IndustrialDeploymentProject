services:
  database:
    image: postgres:15
    ports:
      - "5432:5432"
    env_file:
      - prod.env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - muffin-wallet-network

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    restart: unless-stopped
    extra_hosts:
      - "muffin-wallet.com:host-gateway" # Это нужно чтобы строка из /etc/hosts на локальном компе работала и с сетью Докера!
      - "opentelemetry-collector.com:host-gateway" # Это нужно чтобы строка из /etc/hosts на локальном компе работала и с сетью Докера!
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml
    networks:
      - muffin-wallet-network

networks:
  muffin-wallet-network:
    driver: bridge

volumes:
  db_data:
